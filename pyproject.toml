[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "estim2py"
description = "Simple OO based connection to the Estim 2B box over the serial port."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Public Domain" }
authors = [
    {name = "Sissy Becky", email = "sissybecky@gmail.com"}
]
dependencies = [
    "pyserial>=3.5"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/sissybecky/estim2py"

[tool.hatch.version]
path = "./src/estim2py/__version__.py"

[tool.hatch.envs.default]
env-file = ".env"
dependencies = [
    "pytest",
    "pytest-mock",
    "pytest-timeout",
    "ruff",
    "sphinx",
    "pyserial>=3.5",
    "basedpyright",
    "mypy"
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = "ruff check ."
docs = [
  "sphinx-apidoc -o docs/source/ src/estim2py",
  "sphinx-build docs/source docs/build"
]
docserve = "python -m http.server 8099 --directory docs/build"
release = [
  "test",
  "hatch build",
  "hatch publish"
]

[tool.hatch.build.targets.wheel]
packages = ["src/estim2py"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(relativeCreated).3f [%(levelname)s] %(message)s"
markers = [
	"hardware: box is plugged in.",
	"timing: run long and dangerous experiments. Mount your scratch submissive."
]

[tool.basedpyright]
reportUnnecessaryIsInstance = "hint"
verboseOutput = true
#venvPath = "."
#venv = ".venv"